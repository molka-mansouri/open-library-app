<div class="search-bar">
  <input
    type="text"
    placeholder="Rechercher par titre..."
    [(ngModel)]="titleQuery"
    (input)="onSearchTitle()"
  />

  <input
    type="number"
    placeholder="Année de première édition..."
    [(ngModel)]="yearQuery"
    (input)="onSearchYear()"
  />

  <button type="button" class="clear-btn" (click)="clearFilters()">Réinitialiser</button>
</div>
